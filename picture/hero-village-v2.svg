<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 960" width="960" height="960" role="img" aria-label="Flowing digital data meeting a rural community">
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#03070f"/>
      <stop offset="0.42" stop-color="#07182e"/>
      <stop offset="0.72" stop-color="#0a2730"/>
      <stop offset="1" stop-color="#06141a"/>
    </linearGradient>
    <radialGradient id="glowTeal" cx="50%" cy="50%" r="50%">
      <stop offset="0" stop-color="#2dd4bf" stop-opacity="0.55"/>
      <stop offset="1" stop-color="#2dd4bf" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="glowOrange" cx="50%" cy="50%" r="50%">
      <stop offset="0" stop-color="#ff6b35" stop-opacity="0.5"/>
      <stop offset="1" stop-color="#ff6b35" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="glowViolet" cx="50%" cy="50%" r="50%">
      <stop offset="0" stop-color="#8b5cf6" stop-opacity="0.45"/>
      <stop offset="1" stop-color="#8b5cf6" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="ribbonA" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#22d3ee" stop-opacity="0"/>
      <stop offset="0.25" stop-color="#22d3ee"/>
      <stop offset="0.6" stop-color="#4ade80"/>
      <stop offset="1" stop-color="#fde047"/>
    </linearGradient>
    <linearGradient id="ribbonB" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#a78bfa" stop-opacity="0"/>
      <stop offset="0.35" stop-color="#a78bfa"/>
      <stop offset="0.75" stop-color="#fb7185"/>
      <stop offset="1" stop-color="#ff6b35"/>
    </linearGradient>
    <linearGradient id="beam" x1="0" y1="1" x2="0" y2="0">
      <stop offset="0" stop-color="#ffb37a" stop-opacity="0.55"/>
      <stop offset="1" stop-color="#ffb37a" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="horizon" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ff9a5c" stop-opacity="0"/>
      <stop offset="0.45" stop-color="#ff8a4c" stop-opacity="0.16"/>
      <stop offset="0.75" stop-color="#ffb37a" stop-opacity="0.3"/>
      <stop offset="1" stop-color="#ffb37a" stop-opacity="0.12"/>
    </linearGradient>
    <filter id="blurLg" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="28"/>
    </filter>
    <filter id="blurSm" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="3"/>
    </filter>
    <filter id="nodeGlow" x="-120%" y="-120%" width="340%" height="340%">
      <feGaussianBlur stdDeviation="6" result="b"/>
      <feMerge>
        <feMergeNode in="b"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <rect width="960" height="960" fill="url(#sky)"/>

  <circle cx="240" cy="230" r="320" fill="url(#glowTeal)" filter="url(#blurLg)"/>
  <circle cx="820" cy="650" r="300" fill="url(#glowOrange)" filter="url(#blurLg)"/>
  <circle cx="660" cy="210" r="260" fill="url(#glowViolet)" filter="url(#blurLg)"/>

  <path d="M0 690 C 180 630 340 710 500 660 C 660 610 820 660 960 620 L960 960 L0 960 Z"
        fill="#062028" opacity="0.85"/>
  <path d="M0 702 C 180 642 340 722 500 672 C 660 622 820 672 960 632"
        fill="none" stroke="#2dd4bf" stroke-width="2" opacity="0.35"/>

  <g filter="url(#blurSm)">
    <path d="M-40 400 C 160 270 300 400 470 350 C 640 300 760 430 1000 310"
          fill="none" stroke="url(#ribbonA)" stroke-width="14" opacity="0.22"/>
  </g>
  <path d="M-40 400 C 160 270 300 400 470 350 C 640 300 760 430 1000 310"
        fill="none" stroke="url(#ribbonA)" stroke-width="3" stroke-linecap="round"/>

  <g filter="url(#blurSm)">
    <path d="M-40 540 C 140 620 320 500 500 540 C 680 580 820 500 1000 550"
          fill="none" stroke="url(#ribbonB)" stroke-width="16" opacity="0.2"/>
  </g>
  <path d="M-40 540 C 140 620 320 500 500 540 C 680 580 820 500 1000 550"
        fill="none" stroke="url(#ribbonB)" stroke-width="2.5" stroke-linecap="round"/>

  <g fill="#8bf7ff">
    <circle cx="120" cy="338" r="3.2"/>
    <circle cx="228" cy="348" r="2.4" opacity="0.8"/>
    <circle cx="336" cy="386" r="2.8"/>
    <circle cx="452" cy="353" r="3.4"/>
    <circle cx="586" cy="338" r="2.4" opacity="0.8"/>
    <circle cx="700" cy="392" r="2.8"/>
    <circle cx="836" cy="340" r="3"/>
  </g>
  <g fill="#ffb37a">
    <circle cx="96" cy="590" r="3"/>
    <circle cx="232" cy="592" r="2.6" opacity="0.85"/>
    <circle cx="372" cy="524" r="2.8"/>
    <circle cx="512" cy="542" r="3.4"/>
    <circle cx="648" cy="572" r="2.4" opacity="0.8"/>
    <circle cx="790" cy="518" r="2.8"/>
    <circle cx="902" cy="548" r="3.2"/>
  </g>

  <g stroke="#7dd3fc" stroke-width="1.1" opacity="0.55">
    <path d="M620 200 L696 168 L770 202 L740 276 L656 278 Z"/>
    <path d="M696 168 L722 120 L798 142 L770 202"/>
    <path d="M620 200 L592 258 L656 278"/>
    <path d="M740 276 L806 312 L854 266 L798 142"/>
    <path d="M592 258 L656 278"/>
  </g>
  <g filter="url(#nodeGlow)">
    <circle cx="696" cy="168" r="5.5" fill="#8bf7ff"/>
    <circle cx="770" cy="202" r="4.5" fill="#4ade80"/>
    <circle cx="740" cy="276" r="4" fill="#fde047"/>
    <circle cx="656" cy="278" r="5" fill="#8bf7ff"/>
    <circle cx="620" cy="200" r="4" fill="#a78bfa"/>
    <circle cx="722" cy="120" r="4.5" fill="#ffb37a"/>
    <circle cx="798" cy="142" r="3.6" fill="#8bf7ff"/>
    <circle cx="592" cy="258" r="3.4" fill="#4ade80"/>
    <circle cx="806" cy="312" r="3.8" fill="#a78bfa"/>
    <circle cx="854" cy="266" r="4.2" fill="#fde047"/>
  </g>

  <g font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="17" opacity="0.85">
    <text x="86" y="196" fill="#8bf7ff">&lt;/&gt;</text>
    <text x="112" y="632" fill="#4ade80" opacity="0.75">0x4e</text>
    <text x="404" y="236" fill="#fde047" opacity="0.6">N()</text>
    <text x="512" y="470" fill="#ffb37a" opacity="0.7">block</text>
    <text x="800" y="420" fill="#a78bfa" opacity="0.7">{ }</text>
    <text x="270" y="120" fill="#7dd3fc" opacity="0.55">sha256</text>
  </g>

  <!-- 从村庄升起的数据光束 -->
  <g opacity="0.5">
    <rect x="198" y="470" width="10" height="372" fill="url(#beam)"/>
    <rect x="352" y="530" width="8" height="312" fill="url(#beam)" opacity="0.8"/>
    <rect x="690" y="440" width="10" height="402" fill="url(#beam)"/>
    <rect x="842" y="506" width="7" height="336" fill="url(#beam)" opacity="0.7"/>
  </g>
  <g fill="#ffd9a8" filter="url(#nodeGlow)">
    <circle cx="203" cy="470" r="3"/>
    <circle cx="356" cy="530" r="2.6"/>
    <circle cx="695" cy="440" r="3.2"/>
    <circle cx="845" cy="506" r="2.6"/>
  </g>

  <!-- 地平线暖光：衬托房屋剪影，使其在深色背景上清晰可辨 -->
  <rect x="0" y="560" width="960" height="300" fill="url(#horizon)"/>

  <!-- 房屋下方的黑色地面（已拉长，即使被下方卡片裁切也不影响房屋显示） -->
  <path d="M0 840 L960 840 L960 960 L0 960Z" fill="#01080d"/>

  <!-- 村庄剪影（整体加高，屋顶轮廓明显） -->
  <g fill="#01090f">
    <path d="M0 840 L0 706 L64 706 L64 840Z"/>
    <path d="M46 714 L112 638 L178 714 L178 840 L46 840Z"/>
    <path d="M162 840 L162 686 L212 686 L212 840Z"/>
    <path d="M208 840 L208 700 L292 700 L292 840Z"/>
    <path d="M280 706 L340 624 L400 706 L400 840 L280 840Z"/>
    <path d="M390 840 L390 728 L452 728 L452 840Z"/>
    <path d="M442 732 L502 652 L562 732 L562 840 L442 840Z"/>
    <path d="M552 840 L552 688 L612 688 L612 840Z"/>
    <path d="M596 692 L656 608 L716 692 L716 840 L596 840Z"/>
    <path d="M712 840 L712 714 L772 714 L772 840Z"/>
    <path d="M756 718 L818 638 L880 718 L880 840 L756 840Z"/>
    <path d="M872 840 L872 698 L960 698 L960 840Z"/>
  </g>
  <!-- 屋脊高光：让屋顶折线一眼可辨 -->
  <g fill="none" stroke="#14515c" stroke-width="2.2" opacity="0.85">
    <path d="M46 714 L112 638 L178 714"/>
    <path d="M280 706 L340 624 L400 706"/>
    <path d="M442 732 L502 652 L562 732"/>
    <path d="M596 692 L656 608 L716 692"/>
    <path d="M756 718 L818 638 L880 718"/>
  </g>

  <!-- 窗光 -->
  <g fill="#ffcf8a">
    <rect x="78" y="758" width="12" height="20" rx="1.5" opacity="0.95"/>
    <rect x="118" y="758" width="12" height="20" rx="1.5" opacity="0.7"/>
    <rect x="176" y="730" width="10" height="18" rx="1.5" opacity="0.8"/>
    <rect x="222" y="742" width="12" height="20" rx="1.5" opacity="0.9"/>
    <rect x="252" y="742" width="12" height="20" rx="1.5" opacity="0.65"/>
    <rect x="222" y="712" width="12" height="16" rx="1.5" opacity="0.6"/>
    <rect x="300" y="762" width="14" height="22" rx="1.5" opacity="0.95"/>
    <rect x="346" y="762" width="14" height="22" rx="1.5" opacity="0.75"/>
    <rect x="320" y="724" width="12" height="18" rx="1.5" opacity="0.8"/>
    <rect x="470" y="776" width="12" height="18" rx="1.5" opacity="0.85"/>
    <rect x="516" y="776" width="12" height="18" rx="1.5" opacity="0.6"/>
    <rect x="568" y="726" width="12" height="20" rx="1.5" opacity="0.9"/>
    <rect x="568" y="762" width="12" height="20" rx="1.5" opacity="0.65"/>
    <rect x="614" y="744" width="14" height="22" rx="1.5" opacity="0.95"/>
    <rect x="662" y="744" width="14" height="22" rx="1.5" opacity="0.7"/>
    <rect x="638" y="706" width="12" height="18" rx="1.5" opacity="0.65"/>
    <rect x="728" y="750" width="12" height="20" rx="1.5" opacity="0.9"/>
    <rect x="778" y="762" width="14" height="22" rx="1.5" opacity="0.85"/>
    <rect x="822" y="762" width="14" height="22" rx="1.5" opacity="0.6"/>
    <rect x="896" y="744" width="12" height="20" rx="1.5" opacity="0.8"/>
    <rect x="920" y="744" width="12" height="20" rx="1.5" opacity="0.55"/>
  </g>

  <!-- 上升的数据点 -->
  <g fill="#8bf7ff" opacity="0.8">
    <circle cx="260" cy="640" r="2.2"/>
    <circle cx="286" cy="590" r="1.8"/>
    <circle cx="316" cy="538" r="2"/>
    <circle cx="560" cy="670" r="2.2"/>
    <circle cx="596" cy="610" r="1.8"/>
    <circle cx="632" cy="554" r="2"/>
    <circle cx="760" cy="630" r="1.8"/>
    <circle cx="792" cy="572" r="2.2"/>
  </g>
</svg>
