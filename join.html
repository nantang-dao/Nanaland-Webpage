<script>
        document.getElementById('contact-form').addEventListener('submit', (e) => {
            e.preventDefault();
            const form = e.target;
            const successMsg = document.getElementById('success-message');
            const successIcon = document.getElementById('success-icon');
            
            // Hide form, show success message
            form.classList.add('opacity-0', 'pointer-events-none');
            successMsg.classList.remove('opacity-0', 'pointer-events-none');
            
            // Animate icon
            setTimeout(() => {
                successIcon.classList.remove('scale-50');
                successIcon.classList.add('scale-100');
            }, 50);

            // Reset after 3 seconds
            setTimeout(() => {
                successMsg.classList.add('opacity-0', 'pointer-events-none');
                successIcon.classList.remove('scale-100');
                successIcon.classList.add('scale-50');
                
                setTimeout(() => {
                    form.classList.remove('opacity-0', 'pointer-events-none');
                    form.reset();
                }, 500); // Wait for fade out before showing form again
            }, 3000);
        });
    </script>

<script>
// Mobile menu
const mobileMenuBtn = document.getElementById('mobile-menu-btn');
const mobileMenu = document.getElementById('mobile-menu');
if (mobileMenuBtn && mobileMenu) {
    mobileMenuBtn.addEventListener('click', () => {
        mobileMenu.classList.toggle('hidden');
        mobileMenu.classList.toggle('flex');
    });
}
// Language toggle
function getCurrentLang() { return localStorage.getItem('nanaland-lang') || 'zh'; }
function setLang(lang) {
    localStorage.setItem('nanaland-lang', lang);
    document.querySelectorAll('[data-zh]').forEach(el => {
        el.textContent = el.getAttribute('data-' + lang);
    });
    document.querySelectorAll('[data-zh-placeholder]').forEach(el => {
        el.placeholder = el.getAttribute('data-' + lang + '-placeholder');
    });
    document.querySelectorAll('#lang-toggle, #mobile-lang-toggle').forEach(btn => {
        if (btn) btn.textContent = lang === 'zh' ? 'EN/中' : '中/EN';
    });
}
const initLang = getCurrentLang();
if (initLang === 'en') setLang('en');
document.getElementById('lang-toggle')?.addEventListener('click', () => {
    setLang(getCurrentLang() === 'zh' ? 'en' : 'zh');
});
document.getElementById('mobile-lang-toggle')?.addEventListener('click', () => {
    setLang(getCurrentLang() === 'zh' ? 'en' : 'zh');
});
</script>
